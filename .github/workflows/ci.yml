name: CI

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]

jobs:
  pruebas:
    name: Pruebas (PHPUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist

      - name: Ejecutar casos de prueba
        run: vendor/bin/phpunit --testdox

  imagen:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build --build-arg APP_VERSION=${{ github.sha }} -t sistema-inventario:${{ github.sha }} .

      - name: Probar que el contenedor responde
        run: |
          docker run -d --name prueba -p 8000:8000 sistema-inventario:${{ github.sha }}
          sleep 3
          curl --fail http://localhost:8000/salud
