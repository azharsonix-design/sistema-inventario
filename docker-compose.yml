services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file: .env
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-inventario}
      POSTGRES_USER: ${DB_USERNAME:-inventario}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cambiar_esta_clave}
    ports:
      - "5432:5432"
    volumes:
      - datos-db:/var/lib/postgresql/data

volumes:
  datos-db:
